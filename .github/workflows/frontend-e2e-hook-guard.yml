##
# .github/workflows/frontend-e2e-hook-guard.yml
#
# CI check for security issue #66.
#
# Verifies that the window.__STELLARKRAAL_E2E__ test hook is NOT reachable
# in production builds of the frontend.
#
# Two-layered check:
#   1. Unit test   — runs jest with NODE_ENV=production and asserts the hook
#                    is completely ignored by all exported freighterClient
#                    functions (src/__tests__/freighterClient.production.test.ts).
#   2. Build probe — builds the Next.js app with NODE_ENV=production and
#                    greps the output bundle for any reference to the
#                    __STELLARKRAAL_E2E__ identifier.  A match is a hard
#                    failure: the guard is not working.
#
# Triggers:
#   - Push to main or any branch touching freighterClient
#   - Pull requests targeting main
#   - Manual dispatch
#
# Closes #66
##

name: "Frontend — E2E Hook Production Guard"

on:
  push:
    branches:
      - main
      - "fix/e2e-hook-production-guard*"
    paths:
      - "frontend/src/lib/freighterClient.ts"
      - "frontend/src/__tests__/freighterClient.production.test.ts"
      - ".github/workflows/frontend-e2e-hook-guard.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-e2e-hook-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-production-guard:
    name: "Unit test — hook unreachable in production"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run production-guard regression tests
        env:
          NODE_ENV: production
        run: |
          npx jest \
            --testPathPattern="freighterClient.production.test" \
            --passWithNoTests \
            --forceExit

  build-bundle-probe:
    name: "Build probe — __STELLARKRAAL_E2E__ absent from production bundle"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on PRs / push; skip on manual dispatch unless explicitly needed
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run-build-probe == 'true'

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          NODE_ENV: production
          # Provide a stub contract ID so the build does not abort on missing env
          NEXT_PUBLIC_NETWORK: testnet
        run: npm run build

      - name: Probe bundle for __STELLARKRAAL_E2E__ identifier
        run: |
          echo "Scanning production bundle for __STELLARKRAAL_E2E__ ..."
          # .next/static contains all browser-side chunks
          if grep -r "__STELLARKRAAL_E2E__" .next/static/ 2>/dev/null; then
            echo ""
            echo "FAIL: __STELLARKRAAL_E2E__ found in production bundle."
            echo "The E2E hook is reachable in production — fix the guard in freighterClient.ts."
            exit 1
          else
            echo "PASS: __STELLARKRAAL_E2E__ is not present in any production bundle chunk."
          fi

      - name: Upload bundle on failure (for inspection)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-bundle-${{ github.run_number }}
          path: frontend/.next/static/
          retention-days: 3
