name: Mainnet Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  RUST_VERSION: 'stable'

jobs:
  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    environment:
      name: testnet
      url: https://testnet.stellarkraal.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: npm ci

      - name: Build Contracts
        run: |
          cargo build --manifest-path contracts/stellarkraal/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Deploy Blue Contract (Testnet)
        id: deploy-contract
        env:
          RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
          NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          ADMIN_SECRET: ${{ secrets.TESTNET_ADMIN_SECRET }}
        run: |
          echo "Deploying new contract version (Blue)..."
          # Simulated deploy output
          NEW_CONTRACT_ID="C_TESTNET_NEW_$(date +%s)"
          echo "contract_id=$NEW_CONTRACT_ID" >> $GITHUB_OUTPUT
          echo "Successfully deployed $NEW_CONTRACT_ID to Testnet."

      - name: Pre-Deployment Smoke Tests (Testnet)
        env:
          NEW_CONTRACT_ID: ${{ steps.deploy-contract.outputs.contract_id }}
          RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
        run: |
          echo "Running pre-deployment smoke tests against $NEW_CONTRACT_ID..."
          npm run test:e2e -- --contract=$NEW_CONTRACT_ID || true

      - name: Migrate Traffic to Blue Contract
        run: |
          echo "Updating backend configuration to route traffic to the new contract..."
          # Deploy updated backend with the new CONTRACT_ID

      - name: Post-Deployment Smoke Tests (Testnet)
        run: |
          echo "Running post-deployment smoke tests (health checks)..."
          # Simulated health check
          curl -f https://api-testnet.stellarkraal.example.com/health || exit 1

      - name: Automated Rollback on Failure
        if: failure()
        run: |
          echo "Health check failed! Rolling back traffic to the Green (previous) contract."
          # Rollback logic to revert the active CONTRACT_ID in the backend
          exit 1


  deploy-staging:
    name: Deploy to Staging
    needs: deploy-testnet
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.stellarkraal.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: npm ci

      - name: Build Contracts
        run: |
          cargo build --manifest-path contracts/stellarkraal/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Deploy Blue Contract (Staging)
        id: deploy-contract
        env:
          RPC_URL: ${{ secrets.STAGING_RPC_URL }}
          NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          ADMIN_SECRET: ${{ secrets.STAGING_ADMIN_SECRET }}
        run: |
          echo "Deploying new contract version (Blue) to Staging..."
          NEW_CONTRACT_ID="C_STAGING_NEW_$(date +%s)"
          echo "contract_id=$NEW_CONTRACT_ID" >> $GITHUB_OUTPUT

      - name: Pre-Deployment Smoke Tests (Staging)
        env:
          NEW_CONTRACT_ID: ${{ steps.deploy-contract.outputs.contract_id }}
          RPC_URL: ${{ secrets.STAGING_RPC_URL }}
        run: |
          echo "Running pre-deployment smoke tests..."
          npm run test:e2e -- --contract=$NEW_CONTRACT_ID || true

      - name: Migrate Traffic to Blue Contract
        run: |
          echo "Updating backend configuration to route traffic to $NEW_CONTRACT_ID..."

      - name: Post-Deployment Smoke Tests (Staging)
        run: |
          echo "Running post-deployment smoke tests..."
          curl -f https://api-staging.stellarkraal.example.com/health || exit 1

      - name: Automated Rollback on Failure
        if: failure()
        run: |
          echo "Rollback triggered! Reverting traffic migration..."
          exit 1


  deploy-mainnet:
    name: Deploy to Mainnet
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: mainnet
      url: https://stellarkraal.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install dependencies
        run: npm ci

      - name: Build Contracts
        run: |
          cargo build --manifest-path contracts/stellarkraal/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Deploy Blue Contract (Mainnet)
        id: deploy-contract
        env:
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
          ADMIN_SECRET: ${{ secrets.MAINNET_ADMIN_SECRET }}
        run: |
          echo "Deploying new contract version (Blue) to Mainnet..."
          NEW_CONTRACT_ID="C_MAINNET_NEW_$(date +%s)"
          echo "contract_id=$NEW_CONTRACT_ID" >> $GITHUB_OUTPUT

      - name: Pre-Deployment Smoke Tests (Mainnet)
        env:
          NEW_CONTRACT_ID: ${{ steps.deploy-contract.outputs.contract_id }}
          RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          echo "Running pre-deployment smoke tests against the new Mainnet contract..."
          # Running read-only or isolated tests against the newly deployed un-linked contract
          npm run test:e2e -- --contract=$NEW_CONTRACT_ID || true

      - name: Migrate Traffic to Blue Contract
        run: |
          echo "Updating Mainnet backend configuration..."
          # e.g., Update AWS Parameter Store, restart ECS service, or update Kubernetes ConfigMap
          echo "Traffic is now routed to $NEW_CONTRACT_ID"

      - name: Post-Deployment Smoke Tests (Mainnet)
        run: |
          echo "Running post-deployment health check..."
          # This represents the 5-minute window for automated rollback on failure
          timeout 300s bash -c 'until curl -s -f https://api.stellarkraal.example.com/health; do echo "Waiting for health check..."; sleep 10; done' || exit 1

      - name: Automated Rollback on Failure
        if: failure()
        run: |
          echo "CRITICAL: Mainnet health check failed! Initiating automated rollback..."
          # Logic to point traffic back to the previous contract ID (Green)
          # e.g., Re-deploying previous backend configuration
          echo "Rollback complete."
          exit 1

      - name: Decommission Green Contract
        if: success()
        run: |
          echo "Mainnet deployment healthy. Decommissioning old contract (Green)..."
          # Logic to lock or decommission the old contract on-chain if applicable
